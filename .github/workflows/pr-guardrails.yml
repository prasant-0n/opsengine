name: PR Quality Guardrails

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read
  contents: read

jobs:
  validate-pr:
    name: Conventional Title & PR Description Check
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR Title Format (Conventional Commits)
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: "The subject must not start with an uppercase letter."

      - name: Verify PR Description Quality
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$PR_BODY" ] || [ ${#PR_BODY} -lt 30 ]; then
            echo "::error::PR description is too short or empty. Please use the PR template and provide architecture details and test evidence."
            exit 1
          fi
          echo "✔ PR description meets minimum quality length (${#PR_BODY} characters)."
