name: OpsEngine Enterprise CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ============================================================================
  # STAGE 1: Quality, Security & Secret Detection
  # ============================================================================
  stage-1-quality-security:
    name: "Stage 1: Quality & Security Guardrails"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
        continue-on-error: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: cd services/identity-service && npx prisma generate

      - name: TypeScript Typecheck (@opsengine/web)
        run: pnpm --filter @opsengine/web typecheck

      - name: Monorepo Full Typecheck
        run: pnpm typecheck

  # ============================================================================
  # STAGE 2: Serverless Database Migrations & Vitest Unit/ReBAC Suites
  # ============================================================================
  stage-2-database-testing:
    name: "Stage 2: Database & Vitest Suites (36+ Suites, 375+ Tests)"
    needs: [stage-1-quality-security]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opsengine
          POSTGRES_PASSWORD: opsengine
          POSTGRES_DB: opsengine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://opsengine:opsengine@localhost:5432/opsengine_test
      DIRECT_URL: postgresql://opsengine:opsengine@localhost:5432/opsengine_test
      NEXTAUTH_SECRET: ci-testing-secret-32-chars-long-minimum!
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      AWS_SES_REGION: us-east-1
      AWS_SES_FROM_EMAIL: noreply@opsengine.enterprise
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Environment Files
        run: |
          echo "DATABASE_URL=${{ env.DATABASE_URL }}" > .env
          echo "DIRECT_URL=${{ env.DIRECT_URL }}" >> .env
          echo "NEXTAUTH_SECRET=${{ env.NEXTAUTH_SECRET }}" >> .env
          echo "NEXT_PUBLIC_APP_URL=${{ env.NEXT_PUBLIC_APP_URL }}" >> .env
          cp .env apps/web/.env
          cp .env services/identity-service/.env

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: cd services/identity-service && npx prisma generate

      - name: Apply Prisma Migrations (Direct Connection)
        run: cd services/identity-service && npx prisma migrate deploy

      - name: Seed Database Baseline
        run: cd apps/web && node scripts/seed.mjs

      - name: Run Vitest Suite (Monorepo All Packages)
        run: pnpm test

  # ============================================================================
  # STAGE 3: Production Standalone Next.js 16 App Router Build
  # ============================================================================
  stage-3-production-build:
    name: "Stage 3: Standalone Production Build"
    needs: [stage-2-database-testing]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: postgresql://opsengine:opsengine@localhost:5432/opsengine_test
      DIRECT_URL: postgresql://opsengine:opsengine@localhost:5432/opsengine_test
      NEXTAUTH_SECRET: ci-testing-secret-32-chars-long-minimum!
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Environment Files
        run: |
          echo "DATABASE_URL=${{ env.DATABASE_URL }}" > .env
          echo "DIRECT_URL=${{ env.DIRECT_URL }}" >> .env
          echo "NEXTAUTH_SECRET=${{ env.NEXTAUTH_SECRET }}" >> .env
          echo "NEXT_PUBLIC_APP_URL=${{ env.NEXT_PUBLIC_APP_URL }}" >> .env
          cp .env apps/web/.env
          cp .env services/identity-service/.env

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: cd services/identity-service && npx prisma generate

      - name: Build Standalone Next.js Application
        run: pnpm --filter @opsengine/web build

  # ============================================================================
  # STAGE 4: Playwright End-to-End Integration Tests
  # ============================================================================
  stage-4-e2e-playwright:
    name: "Stage 4: Playwright E2E Integration Suite"
    needs: [stage-3-production-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opsengine
          POSTGRES_PASSWORD: opsengine
          POSTGRES_DB: opsengine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://opsengine:opsengine@localhost:5432/opsengine_test
      DIRECT_URL: postgresql://opsengine:opsengine@localhost:5432/opsengine_test
      NEXTAUTH_SECRET: ci-testing-secret-32-chars-long-minimum!
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      PLAYWRIGHT_TEST_BASE_URL: http://localhost:3001
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Environment Files
        run: |
          echo "DATABASE_URL=${{ env.DATABASE_URL }}" > .env
          echo "DIRECT_URL=${{ env.DIRECT_URL }}" >> .env
          echo "NEXTAUTH_SECRET=${{ env.NEXTAUTH_SECRET }}" >> .env
          echo "NEXT_PUBLIC_APP_URL=${{ env.NEXT_PUBLIC_APP_URL }}" >> .env
          cp .env apps/web/.env
          cp .env services/identity-service/.env

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: cd services/identity-service && npx prisma generate

      - name: Apply Prisma Migrations
        run: cd services/identity-service && npx prisma migrate deploy

      - name: Seed Database Baseline
        run: cd apps/web && node scripts/seed.mjs

      - name: Install Playwright Chromium & OS Dependencies
        run: cd apps/web && npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: cd apps/web && npx playwright test

      - name: Upload Playwright Test Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
