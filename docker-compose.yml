services:
  postgres:
    image: postgres:16-alpine
    container_name: opsengine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opsengine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opsengine}
      POSTGRES_DB: ${POSTGRES_DB:-opsengine}
    ports:
      - "${POSTGRES_PORT:-5436}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opsengine} -d ${POSTGRES_DB:-opsengine}"]
      interval: 3s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    container_name: opsengine-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3002}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-opsengine}:${POSTGRES_PASSWORD:-opsengine}@postgres:5432/${POSTGRES_DB:-opsengine}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-enterprise-ops-dev-secret-32-chars-long!}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3002}
      AWS_SES_REGION: ${AWS_SES_REGION:-us-east-1}
      AWS_SES_FROM_EMAIL: ${AWS_SES_FROM_EMAIL:-noreply@opsengine.enterprise}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
