databases:
  - name: opsengine-postgres
    databaseName: opsengine
    user: opsengine
    plan: free
    region: oregon
    ipAllowList: []

services:
  - type: web
    name: opsengine-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    region: oregon
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: opsengine-postgres
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: opsengine-postgres
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: MOCK_GOOGLE_SSO
        value: "true"
